<!doctype html>
<html lang="fr">
  <head>

    <title>Votre accès à Ernesto</title>

  <body style="margin:0;padding:0;background:#f4f6f2;font-family:Arial,Helvetica,sans-serif;color:#1d2a22;">

      <tr>

            </tr>
            <tr>
              <td style="padding:18px 28px 30px 28px;">

                <p style="margin:10px 0 22px 0;font-size:14px;line-height:1.6;color:#68756c;">Créez votre mot de passe pour commencer.</p>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#445432;color:#ffffff;text-decoration:none;font-size:14px;font-weight:700;padding:13px 18px;border-radius:12px;">Activer mon accès</a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 24px 28px;font-size:11px;line-height:1.5;color:#98a097;">ernesto.epppn.fr</td>
